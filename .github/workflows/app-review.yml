name: App Weekly Review

# Evaluates how NEW signals actually performed and publishes the Weekly tab data.
on:
  schedule:
    - cron: "30 10 * * 6"   # Saturday 10:30 UTC = 18:30 MYT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and publish review
        env:
          MARKET: ${{ vars.MARKET || 'MYX' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          TV_MAX_WORKERS: ${{ vars.TV_MAX_WORKERS || '5' }}
          TV_BARS: ${{ vars.TV_BARS || '300' }}
          TV_CONNECT_GAP: ${{ vars.TV_CONNECT_GAP || '0.25' }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python export_review.py --publish
