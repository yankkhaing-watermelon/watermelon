name: App Scan

on:
  schedule:
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade git+https://github.com/rongardF/tvdatafeed.git
      - name: Run scan and publish
        env:
          MARKET: ${{ vars.MARKET || 'MYX' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          MIN_UNIVERSE: ${{ vars.MIN_UNIVERSE || '800' }}
          TV_MAX_WORKERS: ${{ vars.TV_MAX_WORKERS || '3' }}
          TV_BARS: ${{ vars.TV_BARS || '500' }}
        run: python export_scan.py --publish
      - name: Commit signal log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_signals_*.csv .cache/bursa_universe.csv
          git diff --staged --quiet || git commit -m "signals: $(date -u +%Y-%m-%d)"
          git push
