<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BursaMusangKing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --text:#111110; --muted:#6b6a66; --faint:#9a9994;
  --line:rgba(17,17,16,.12); --accent:#2a78d6; --accent-bg:#e6f1fb;
  --up:#0ca30c; --down:#d03b3b; --radius:10px;
}
html[data-theme="dark"]{
  --bg:#111110; --card:#1c1c1a; --text:#f2f2ef; --muted:#a3a29c; --faint:#7a7975;
  --line:rgba(255,255,255,.13); --accent:#5b9cea; --accent-bg:#12283f;
  --up:#3fbe3f; --down:#e26363;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:contain}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--card)}
header{position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:.5px solid var(--line);padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;
